name: Check workspace
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Validate notebook structure and Python syntax
        run: python scripts/check_workspace.py
      - name: Check rebuild command
        run: python scripts/build_artifacts.py --help
